		</div>

	<div class="container conteudo login-page">
		<div class="login row">
			<div class="frase-impacto col-md-6">
				<h1>Mapear para <span class="color1">Conectar</span>, <br>Conectar para <span class="color2">Alimentar</span>!</h1>
				<div class="container-login">
					<button type="button" class="menu"><a href="cadastro.html" target="_parent">Registre a<br>sua horta</a></button>
				</div>
				<div class="container-login">
					<button type="button" class="menu"><a href="cadastro.html" target="_parent">Quer ser<br>um voluntário</a></button>
				</div>
				<div class="container-login">
					<button type="button" class="menu"><a href="cadastro.html" target="_parent">Novo<br>usuário?</a></button>
				</div>
			</div>
			<form class="forms-login col-md-6">
				<div class="row g-3">
					<label for="exampleFormControlInput1" class="form-label titulo-label">E-mail</label>
					<input type="email" class="form-control" id="email" placeholder="name@example.com"
						required pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$">
				</div>
				<div class="row g-3 senha">
					<label for="inputPassword" class="col-form-label titulo-label">Senha</label>
					<input type="password" class="form-control" id="inputPassword" required>
				</div>
				<div class="my-forms row g-4">
					<div class="container-botao">
						<button type="submit" class="botao"><a href="area_dashboard.html">Enviar</a></button>
					</div>
				</div>
			</form>
